[project]
name = "model-quantization-recipes"
version = "0.1.0"
description = "Quantization recipes and deployment workflows for LLM and ASR models."
requires-python = ">=3.10,<3.13"
authors = [
  { name = "quangnd58" },
  { name = "vrfai" },
]
license = { text = "BSD-3-Clause" }

[project.optional-dependencies]
gemma4 = [
  "torch>=2.3",
  "transformers==4.57.6",
  "accelerate==1.12.0",
  "datasets==2.19.0",
  "huggingface-hub==0.36.2",
  "tokenizers==0.22.2",
  "safetensors==0.7.0",
  "nvidia-modelopt[all]==0.39.0",
  "peft==0.18.1",
  "diffusers==0.37.0",
  "sentencepiece==0.2.1",
  "protobuf==6.33.6",
  "numpy==2.2.6",
  "tqdm==4.67.3",
]
qwen3-asr = [
  "torch>=2.8.0",
  "torchaudio>=2.8.0",
  "transformers>=4.40.0",
  "safetensors>=0.4.0",
  "huggingface-hub>=0.23.0",
  "nvidia-modelopt>=0.39.0",
  "soundfile>=0.12.0",
  "jiwer>=3.0.0",
  "datasets==2.19.0",
  "tqdm>=4.66.0",
  "requests>=2.31.0",
  "numpy>=1.24.0",
  "pyyaml>=6.0.0",
]
qwen36-27b = [
  "torch>=2.10.0",
  "torchvision>=0.25.0",
  "transformers==5.6.0",       # 5.6.x required; patches in quantize.sh target this
  "accelerate==1.12.0",
  "datasets==2.19.0",
  "huggingface-hub==0.36.2",
  "tokenizers==0.22.2",
  "safetensors==0.7.0",
  "llmcompressor==0.10.0.1",
  "compressed-tensors==0.14.0.1",
  "sentencepiece==0.2.1",
  "numpy==2.2.6",
  "tqdm==4.67.3",
  "pyyaml>=6.0.2",
]
qwen36-moe-35b-nvfp4 = [
  "torch>=2.3",
  "transformers==5.5.4",
  "accelerate==1.12.0",
  "datasets==2.19.0",
  "nvidia-modelopt[all]==0.39.0",
  "safetensors==0.7.0",
]
cosmos-reason2 = [
  "torch>=2.10.0",
  "torchvision>=0.25.0",
  "transformers==4.57.6",
  "accelerate==1.12.0",
  "datasets==2.19.0",
  "huggingface-hub==0.36.2",
  "tokenizers==0.22.2",
  "safetensors==0.7.0",
  "llmcompressor==0.10.0.1",
  "compressed-tensors==0.14.0.1",
  "peft==0.18.1",
  "diffusers==0.37.0",
  "sentencepiece==0.2.1",
  "numpy==2.2.6",
  "tqdm==4.67.3",
]

# numpy and scipy are deliberately omitted here. This recipe requires numpy 1.x
# (OpenCV and diffusers break under numpy 2 on Jetson) while three other extras pin
# numpy==2.2.6, so rather than assert a resolution outcome we install them as a
# documented post-sync step; see recipes/internvla-n1-dualvln/requirements-torch.txt.
internvla-n1-dualvln = [
  "torch>=2.9.0",
  "torchvision>=0.24.0",
  "transformers==4.51.3",
  "diffusers==0.33.1",
  "accelerate==1.13.0",
  "safetensors>=0.8.0",
  "huggingface-hub>=0.36.0",
  "nvidia-modelopt>=0.44.0",
  "onnx==1.22.0",
  "onnxscript==0.7.1",
  "onnx-graphsurgeon==0.6.1",
  "pandas>=2.0.0",
  "pillow>=10.0.0",
  "numpy-quaternion>=2023.0.0",
  "pyyaml>=6.0.0",
  "tqdm>=4.66.0",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "datasets",
  "modelopt",
  "modelopt.*",
  "torch",
  "transformers",
  "llmcompressor",
]
ignore_missing_imports = true